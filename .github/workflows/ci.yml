name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PowerShell 7
        # windows-latest already includes pwsh; keep step for clarity
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          Get-Command pwsh | Format-List

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./tests/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke build release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Build-Release.ps1 -SkipMsi
          if (-not (Test-Path ./dist/*.zip)) { throw 'zip missing' }
